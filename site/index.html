<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResInsight dev dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>ResInsight <code>dev</code> dashboard</h1>
      <div id="head" class="muted"></div>
    </div>
    <div class="right">
      <div id="overall" class="badge"></div>
      <div id="updated" class="muted"></div>
    </div>
  </header>
  <main>
    <section><h2>Build matrix</h2><div id="builds" class="cards"></div></section>
    <section><h2>Tests</h2><div id="tests" class="cards"></div></section>
    <section><h2>Releases &amp; nightly binaries</h2><div id="releases" class="cards"></div></section>
    <section><h2>Code quality</h2><div id="quality" class="cards"></div></section>
    <section><h2>Links</h2><ul id="links" class="links"></ul></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
